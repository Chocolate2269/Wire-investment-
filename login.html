<!DOCTYPE html>
<html lang="en">
<head>
  <title>Login - Wire Coincheap</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *{margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Arial, sans-serif}
    
    body{
      background: linear-gradient(135deg, #0a192f 0%, #112240 50%, #1a365d 100%);
      min-height:100vh; 
      display:flex; 
      align-items:center; 
      justify-content:center; 
      padding:20px;
      position:relative;
    }
    
    body::before{
      content:'';
      position:absolute;
      width:500px;
      height:500px;
      background: radial-gradient(circle, rgba(34,197,94,0.2) 0%, transparent 70%);
      border-radius:50%;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
    }
    
    .container{
      max-width:420px; 
      width:100%; 
      background: rgba(255,255,255,0.98); 
      border-radius:20px; 
      padding:40px 30px; 
      box-shadow:0 25px 80px rgba(0,0,0,0.4); 
      text-align:center;
      position:relative;
      z-index:2;
      border:1px solid rgba(34,197,94,0.2);
    }
    
    .globe{font-size:45px; margin-bottom:15px}
    h2{color:#0a192f; font-size:26px; margin-bottom:8px}
    p{color:#64748b; font-size:14px; margin-bottom:25px}
    
    input{
      width:100%; 
      padding:16px; 
      margin:10px 0; 
      border:2px solid #e2e8f0; 
      border-radius:12px; 
      font-size:15px;
      transition:0.3s;
    }
    input:focus{
      outline:none;
      border-color:#22c55e;
      box-shadow:0 0 0 3px rgba(34,197,94,0.1);
    }
    
    .btn{
      width:100%; 
      padding:16px; 
      margin:12px 0; 
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color:white; 
      border:none; 
      border-radius:12px; 
      font-weight:700; 
      font-size:15px; 
      cursor:pointer;
      transition:0.3s;
      box-shadow:0 6px 18px rgba(34,197,94,0.35);
    }
    .btn:hover{transform:translateY(-2px); box-shadow:0 10px 30px rgba(34,197,94,0.5)}
    .btn:disabled{opacity:0.6; cursor:not-allowed}
    
    .back{
      display:block; 
      margin-top:20px; 
      color:#64748b; 
      text-decoration:none;
      font-size:13px;
    }
    .back:hover{color:#22c55e}
    
    #otpSection{display:none}
    .success{color:#16a34a; font-size:13px; margin-top:10px}
  </style>
</head>
<body>
  <div class="container">
    <div class="globe">🌍</div>
    <h2>Secure Login</h2>
    <p>Enter your phone number to receive OTP</p>
    
    <div id="phoneSection">
      <input type="tel" id="phone" placeholder="+234 801 234 5678" required>
      <button class="btn" onclick="sendOTP()">Send OTP</button>
    </div>
    
    <div id="otpSection">
      <input type="text" id="otp" placeholder="Enter 6-digit OTP" maxlength="6">
      <button class="btn" onclick="verifyOTP()">Verify & Login</button>
      <p class="success">OTP sent to your phone</p>
    </div>
    
    <a href="index.html" class="back">← Back to Home</a>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let userPhone = '';

async function sendOTP() {
  userPhone = document.getElementById('phone').value;
  if(!userPhone){ alert('Enter phone number'); return; }
  
  const { error } = await supabase.auth.signInWithOtp({
    phone: userPhone
  });
  
  if(error){
    alert('Error: ' + error.message);
  } else {
    document.getElementById('phoneSection').style.display = 'none';
    document.getElementById('otpSection').style.display = 'block';
  }
}

async function verifyOTP() {
  const otp = document.getElementById('otp').value;
  
  const { data, error } = await supabase.auth.verifyOtp({
    phone: userPhone,
    token: otp,
    type: 'sms'
  });
  
  if(error){
    alert('Invalid OTP');
  } else {
    alert('Login Successful!');
    window.location = 'activate-investment.html';
  }
}
</script>
</body>
</html>
