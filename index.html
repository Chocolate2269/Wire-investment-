<html lang="en">
<head>
  <title>Wire Coincheap - Global Trading Platform</title>

  <style>
    *{margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, sans-serif}
    
    body{
      background: linear-gradient(135deg, #0a192f 0%, #112240 50%, #1a365d 100%);
      color:#fff;
      position:relative;
    }
    
    body::before{
      content:'';
      position:fixed;
      width:700px;
      height:700px;
      background: radial-gradient(circle, rgba(34,197,94,0.15) 0%, transparent 70%);
      border-radius:50%;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      z-index:0;
    }
    
    .container{max-width:1100px; margin:0 auto; padding:20px; position:relative; z-index:2}
    
    header{text-align:center; padding:60px 20px}
    .globe{font-size:60px; margin-bottom:15px}
    .badge{background: linear-gradient(135deg, #22c55e, #16a34a); color:white; padding:8px 18px; border-radius:20px; font-size:12px; font-weight:700; letter-spacing:1px; display:inline-block; margin-bottom:15px}

    .tagline{color:#94a3b8; font-size:16px; margin-bottom:30px}
    
    .btn{padding:15px 30px; background: linear-gradient(135deg, #22c55e, #16a34a); color:white; text-decoration:none; border-radius:12px; font-weight:700; margin:8px; display:inline-block; transition:0.3s; box-shadow:0 6px 18px rgba(34,197,94,0.35)}
    .btn:hover{transform:translateY(-3px)}
    .btn-outline{background:transparent; border:2px solid #22c55e}
    
    .plans{padding:60px 20px; text-align:center}
    .plans h2{font-size:32px; margin-bottom:10px}
    .plans-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); gap:20px; margin-top:40px}
    
    .plan-card{
      background: rgba(255,255,255,0.95); 
      color:#0a192f; 
      padding:30px; 
      border-radius:18px; 
      text-align:left;
      box-shadow:0 10px 40px rgba(0,0,0,0.3);
      border:2px solid transparent;
      transition:0.3s;
    }
    .plan-card:hover{border-color:#22c55e; transform:translateY(-5px)}
    .plan-card h3{color:#22c55e; font-size:22px; margin-bottom:10px}
